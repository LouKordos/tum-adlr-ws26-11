[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adlr-rwm"
version = "0.1.0"
description = "Contact-aware world-model learning and evaluation in Isaac Lab 3.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "isaaclab[isaacsim]==3.0.0",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "numpy>=2",
]

# Isaac Lab discovers external task packages through this group.
[project.entry-points."isaaclab.tasks"]
adlr_rwm = "adlr_rwm.tasks"

[tool.setuptools.packages.find]
where = ["src"]
include = ["adlr_rwm*"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14",
]

# As per dependency resolution policy used in the Isaac Lab 3.0.0:
[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = false

[[tool.uv.index]]
name = "pypi-public"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
index-strategy = "unsafe-best-match"
prerelease = "allow"
python-preference = "only-managed"
python-downloads = "automatic"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# From https://github.com/isaac-sim/IsaacLab/blob/v3.0.0/tools/wheel_builder/uv-overrides.txt
# Needed because Isaac Sim 6.2's metadata pins incompatible older versions.
override-dependencies = [
    "numpy>=2",
    "mujoco~=3.12.0",
    "mujoco-warp~=3.12.0",
    "newton[sim]==1.6.1",
    "newton-usd-schemas>=0.5.0",
    "usd-exchange==3.0.1",
    "usd-optimize~=1.3.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "fsspec>=2026.6.0",
    "packaging>=20,<27",
    "urllib3>=2.8.0",
]

[tool.uv.sources]
isaaclab = { index = "nvidia" }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
omniverseclient = { index = "pypi-public" }
ovphysx = { index = "pypi-public" }
ovrtx = { index = "pypi-public" }
ovstage = { index = "pypi-public" }

[tool.ruff]
target-version = "py312"
line-length = 120
