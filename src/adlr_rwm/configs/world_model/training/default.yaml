# Kwargs for adlr_rwm.data.RWMDataset (history/forecast horizons come from cfg.world_model).
dataset:
  data_dir: data/recordings   # single .hdf5 file or directory searched recursively
  stride: 1                   # step between window start indices within an episode
  only_successful: false      # skip episodes without the success flag
  preload: true               # load all episodes into RAM once (~0.8 GB for the 20k-episode recording)
  max_cached_episodes: 128    # per-worker LRU cache, only used with preload=false

# Whole episodes are assigned to train/val/test, so overlapping windows of one episode never end up in two splits.
split:
  val_fraction: 0.1
  test_fraction: 0.1
  seed: 0                     # separate from the training seed: changing the training seed keeps the same split

# States and actions are normalized per dimension, (x - mean) / std, with train split stats saved in every checkpoint
normalization:
  min_std: 1.0e-3             # floor for near-constant dimensions

# Kwargs for adlr_rwm.data.make_dataloader (appled to train only because val uses shuffle=false).
dataloader:
  batch_size: 1024
  shuffle: true
  num_workers: 4
  pin_memory: true
  drop_last: true
  persistent_workers: null
  prefetch_factor: 2

num_epochs: 100
limit_batches: null           # cap batches per epoch and per evaluation, for quick tests (null = all)

optimizer:
  type: adam                  # adam | adamw
  lr: 1.0e-3
  weight_decay: 0.0
  betas: [0.9, 0.999]

lr_scheduler:
  type: none                  # none | cosine | step
  warmup_epochs: 0
  min_lr: 1.0e-5              # cosine only
  step_size: 30               # step only, in epochs
  gamma: 0.1                  # step only

max_grad_norm: null            # null disables gradient clipping

# Passed to SystemDynamicsEnsemble.compute_loss.
bootstrap: true               # each ensemble head gets a resampled (with replacement) batch
loss:
  type: gaussian_nll          # gaussian_nll | mse
  weights:
    state: 1.0
    bound: 0.01               # logstd min/max bound regularizer (PETS uses 0.01). 0 if logstd head disabled
    extension: 1.0
    contact: 1.0
    termination: 1.0

logging:
  log_interval: 50            # optimizer steps
  eval_interval: 1000         # optimizer steps, plus once after the last step (0 = only then)
  eval_windows: 50000         # fixed random subset of the val windows (~370k) used by every evaluation (null = all)
  watch_interval: 50        # gradient histograms in wandb every N steps (0 = off)
  wandb:
    enabled: true
    project: adlr-rwm
    entity: null
    # Same timestamp as Hydra's run directory (outputs/<date>/<time>)
    run_name: ${now:%Y-%m-%d}_${now:%H-%M-%S}_${world_model.base.type}_${world_model.training.loss.type}_s${seed}
    group: null               # same group for runs that only differ in the seed so that wandb shows mean/std
    tags: []

# Saved in the run directory (outputs/<date>/<time>) next to config.yaml and split.json
checkpoint:
  interval: 2                # epochs, in addition to last.pt
  keep_best: true             # also keep best.pt, the checkpoint with the lowest val `best_metric`
  best_metric: mse            # forecast MSE (comparable across loss types), or state_loss (the configured loss)
